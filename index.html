.ok{color:#7ee2a7}

  };

  if (produce[a] === b) return `${a}生${b}`;
  // 再判斷反向相生（自動調整順序）
  if (produce[b] === a) return `${b}生${a}`;

  if (control[a] === b) return `${a}剋${b}`;
  // 再判斷反向相剋（自動調整順序）
  if (control[b] === a) return `${b}剋${a}`;

    function sortElementsForDisplay(elements){
  const produceOrder = ["木","火","土","金","水"];

  const counts = {};
  elements.forEach(el => {
    counts[el] = (counts[el] || 0) + 1;
  });

  const unique = [...new Set(elements)];

  for (let i = 0; i < produceOrder.length; i++) {
    const rotated = [...produceOrder.slice(i), ...produceOrder.slice(0, i)];
    const filtered = rotated.filter(el => unique.includes(el));

    if (filtered.length === unique.length) {
      const result = [];
      filtered.forEach(el => {
        for (let j = 0; j < counts[el]; j++) {
          result.push(el);
        }
      });
      return result;
    }
  }

  return elements;
}

function describeFiveElements(elements){
  const sorted = sortElementsForDisplay(elements);
  const special = [];
  const same = [];

  for (let i = 0; i < sorted.length - 1; i++) {
    const rel = relationOf(sorted[i], sorted[i + 1]);
    if (rel.includes("生") || rel.includes("剋")) {
      special.push(rel);
    } else if (rel.includes("旺")) {
      same.push(rel);
    }
  }

  return [...new Set([...special, ...same])].join("、");
}

      .toString()
      .split("")
      .reduce((a,b)=>a + Number(b),0);
  }

  return num;
}

function getLiuNian(lifeNumber, birthYear){

  const yearNow = new Date().getFullYear();

  // 虛歲
  const age = yearNow - birthYear + 1;

  const stages = [
    "胎",
    "養",
    "長生",
    "冠帶",
    "臨官",
    "帝旺",
    "衰",
    "病",
    "死",
    "絕"
  ];

  const raw = (lifeNumber + age - 1) % 10;

  const index = raw === 0 ? 9 : raw - 1;

  return {
    age,
    current: {
      stage: stages[index]
    }
  };
}
function analyzeName(fullName){

  if (!fullName.trim()) {
    throw new Error("請輸入姓名");
  }

  const birthYear = parseInt(document.getElementById("birthYear").value);

if (!birthYear) {
  throw new Error("請輸入出生年");
}
  const { surname, given1, given2, isSingleName } = parseName(fullName);

  if (typeof surnameStrokeDict[surname] !== "number") {
    throw new Error(`找不到姓氏筆畫：${surname}`);
  }

  const S = surnameStrokeDict[surname];
  const extraStrokeDict = JSON.parse(localStorage.getItem("extraStrokeDict") || "{}");
const fullNameStrokeDict = {
  ...nameStrokeDict,
  ...extraStrokeDict
};

const M1 = fullNameStrokeDict[given1];

  if (typeof M1 !== "number") throw new Error(`名字字庫缺字：${given1}`);

  let M2 = null;
  if (!isSingleName) {
    M2 = fullNameStrokeDict[given2];
    if (typeof M2 !== "number") {
      throw new Error(`名字字庫缺字：${given2}`);
    }
  }

  const P = S + 1;
  const D = S + M1;
  const C = isSingleName ? (M1 + 1) : (M1 + M2);
  const L = isSingleName ? (S + M1) : (S + M1 + M2);

  const creative = normalizeDiff(P, D);
  const mindset = getDigitPairValue(D);
  const drive = normalizeDiff(D, C);
  const team = getDigitPairValue(C);
  const goal = getDigitPairValue(L);

  const parentEl = elementOf(P);
  const diseaseEl = elementOf(D);
  const childEl = elementOf(C);

  const thoughtFn = relationOf(parentEl, diseaseEl);
  const actionFn = relationOf(diseaseEl, childEl);

  const [starName, starMeaning] = lifeStarMap[L] || ["未知星","暫無對應"];

  const liuNian =
getLiuNian(L, birthYear);
  const country =
document.getElementById("countrySelect").value;

const baseYear =
countryYears[country];

const countryYear =
new Date().getFullYear() - baseYear + 1;

const countryDigit =
reduceToDigit(countryYear);

const lifeDigit =
reduceToDigit(L);

const cycle = [];

for(let i = 0; i < 9; i++){

  let val = lifeDigit + i;

  if(val > 9){
    val -= 9;
  }

  cycle.push(val);
}

const chancePoint =
chanceMap[
  cycle.indexOf(countryDigit)
];
const yearOracle = getYearOracle(
  liuNian.current.stage,
  chancePoint
);
const poem = goalPoemMap.hasOwnProperty(goal)
? goalPoemMap[goal]
: "此目標磁場暫無對應人生啟示錄。";

  const metrics = { creative, mindset, drive, team, goal };
  const matchedGenes = geneRules.filter(rule => metrics[rule.keyA] === metrics[rule.keyB]);

  let text =
`命格分析：${fullName}
命格排列：${P}/${D}/${C}/${L}
先天五行：${thoughtFn}
後天五行：${actionFn}
命宮星座：${starName}
象徵：${starMeaning}
人生啟示錄：
${poem}
＝＝＝＝＝＝＝＝＝＝
今年歲數：${liuNian.age}歲
流年階段：${liuNian.current.stage}
今年機會點（${country}）：${chancePoint}
當年啟示錄：
${yearOracle}
＝＝＝＝＝＝＝＝＝＝
特殊基因：${matchedGenes.length}條：`;
if (matchedGenes.length === 0) {
  text += "\n成功基因0條";
} else {
  matchedGenes.forEach(g => {
    text += `\n${g.name}\n${g.text}`;
  });
}


  return { P, D, C, L, text };
}
