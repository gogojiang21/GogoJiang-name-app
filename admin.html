<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>補字庫管理</title>
<style>
body{
  font-family:"Microsoft JhengHei",sans-serif;
  background:#1e1b2e;
  color:white;
  padding:30px;
}
.box{
  max-width:520px;
  margin:auto;
  background:rgba(255,255,255,.08);
  padding:24px;
  border-radius:20px;
}
input,button{
  width:100%;
  padding:14px;
  margin:8px 0;
  border-radius:12px;
  border:0;
  font-size:16px;
}
button{
  background:#c89b5a;
  color:white;
  font-weight:bold;
}
.item{
  padding:10px;
  border-bottom:1px solid rgba(255,255,255,.2);
}
</style>
</head>
<body>
  <a href="index.html" style="
  position:fixed;
  top:20px;
  left:20px;
  padding:12px 18px;
  border-radius:999px;
  background:#c89b5a;
  color:white;
  font-size:15px;
  font-weight:bold;
  text-decoration:none;
  z-index:9999;
  box-shadow:0 8px 24px rgba(0,0,0,0.4);
">
  ← 回主頁
</a>

<div class="box">
  <h1>補字庫管理</h1>

  <input id="charInput" maxlength="1" placeholder="輸入要補的字，例如：瑜">
  <input id="strokeInput" type="number" placeholder="輸入筆畫，例如：14">

  <button onclick="addChar()">新增 / 修改</button>
  <button onclick="clearAll()">清空補充字庫</button>

  <h3>目前補充字庫</h3>
  <div id="list"></div>
</div>

<script>
const pwd = prompt("請輸入管理密碼");

if (pwd !== "831211") {
  document.body.innerHTML = "<h2 style='color:white;text-align:center;margin-top:80px;'>無權限</h2>";
}

function getExtraDict(){
  return JSON.parse(localStorage.getItem("extraStrokeDict") || "{}");
}

function saveExtraDict(dict){
  localStorage.setItem("extraStrokeDict", JSON.stringify(dict));
}

function addChar(){
  const ch = document.getElementById("charInput").value.trim();
  const stroke = Number(document.getElementById("strokeInput").value);

  if (!ch || ch.length !== 1) {
    alert("請輸入一個中文字");
    return;
  }

  if (!stroke || stroke <= 0) {
    alert("請輸入正確筆畫");
    return;
  }

  const dict = getExtraDict();
  dict[ch] = stroke;
  saveExtraDict(dict);

  document.getElementById("charInput").value = "";
  document.getElementById("strokeInput").value = "";

  renderList();
}

function deleteChar(ch){
  const dict = getExtraDict();
  delete dict[ch];
  saveExtraDict(dict);
  renderList();
}

function clearAll(){
  if(confirm("確定清空補充字庫？")){
    localStorage.removeItem("extraStrokeDict");
    renderList();
  }
}

function renderList(){
  const dict = getExtraDict();
  const list = document.getElementById("list");

  const keys = Object.keys(dict);

  if(keys.length === 0){
    list.innerHTML = "目前沒有補字。";
    return;
  }

  list.innerHTML = keys.map(ch => `
    <div class="item">
      ${ch}：${dict[ch]} 劃
      <button onclick="deleteChar('${ch}')">刪除</button>
    </div>
  `).join("");
}

renderList();
</script>

</body>
</html>
